# One-command local StoreForge.
#
#   docker compose up --build
#
# Brings up Postgres, applies migrations, and starts the app on
# http://localhost:3000 with no other setup. Add an Anthropic key to the
# environment to get real AI generation instead of the local planner.

name: storeforge

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: storeforge
      POSTGRES_PASSWORD: storeforge
      POSTGRES_DB: storeforge
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed so you can psql into it; remove if the port is in use.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeforge -d storeforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://storeforge:storeforge@db:5432/storeforge
      # Fine for local testing. Generate a real one for anything else:
      # openssl rand -hex 32
      NUXT_SESSION_SECRET: local-development-secret-do-not-use-in-production
      NUXT_PUBLIC_APP_URL: http://localhost:3000
      # Passed through from your shell when set; empty means the local planner
      # builds stores from niche templates instead of calling Claude.
      NUXT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NUXT_ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Leave Stripe and Resend unset: every org stays on the free plan and
      # invite links are printed to the logs rather than emailed.
    ports:
      - "3000:3000"
    # Migrations run here rather than at image build, because they need the
    # database to be up. Safe to repeat — already-applied migrations are
    # skipped.
    command: >
      sh -c "npx tsx scripts/migrate.ts && node .output/server/index.mjs"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
