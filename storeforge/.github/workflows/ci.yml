name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storeforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/storeforge_test
      NUXT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/storeforge_test
      NUXT_SESSION_SECRET: ci-secret-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The integration suite runs against the production bundle, so the build
      # has to happen before the tests rather than alongside them.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The runtime image cannot be built in every development environment, so CI
  # is where the Dockerfile is actually verified.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: storeforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and reports unhealthy without a database
        run: |
          docker run -d --name storeforge-ci -p 3000:3000 \
            -e NUXT_DATABASE_URL=postgres://nobody@127.0.0.1:1/none \
            -e NUXT_SESSION_SECRET=ci-secret-0123456789abcdef0123456789abcdef \
            storeforge:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            # 503 is the correct answer with an unreachable database: it proves
            # the process booted and the health check really touches Postgres.
            if [ "$code" = "503" ]; then echo "image boots, health check works"; exit 0; fi
            sleep 2
          done
          echo "image did not become reachable"; docker logs storeforge-ci; exit 1
